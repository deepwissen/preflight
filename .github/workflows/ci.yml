name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Unit tests on all three OSes — Windows especially, to catch path-separator bugs
  # (a `\`-path breaking an exact file-name check, or a backslash in a SARIF URI).
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Engine floor-check gate (shared with vet): every value symbol preflight imports
  # from @deepwissen/preflight-core must exist in the MINIMUM engine version the
  # declared range allows, so a stale in-range resolve can't crash with "no export".
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-engine-floor.mjs

  # Behavioral QA: the scenario suites (real files/paths — the ones that catch the next
  # backslash bug) run on Linux AND Windows. The anthropics false-positive gate is bash +
  # git clone, so Linux only. plugins.sh needs the `claude` CLI → local-only.
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run qa # skills.mjs + config.mjs scenario suites (plain Node, cross-platform)
      - run: npm run qa:fp-gate # bash + git clone — Linux only
        if: matrix.os == 'ubuntu-latest'
