name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Engine floor-check gate (shared with vet): every value symbol preflight imports
  # from @deepwissen/preflight-core must exist in the MINIMUM engine version the
  # declared range allows, so a stale in-range resolve can't crash with "no export".
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-engine-floor.mjs

  # Behavioral QA: the scenario suites (real attacks must stay flagged, benign skills
  # must stay clean) AND the anthropics false-positive gate (Anthropic's own skills must
  # install without --force). This is what stops a rule change from regressing in either
  # direction. plugins.sh needs the `claude` CLI, so it's a local-only check.
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run qa # skills.mjs + config.mjs scenario suites (exit non-zero on any fail)
      - run: npm run qa:fp-gate # clones anthropics/skills @ pinned SHA, must scan clean
